#
# - ticker: primary listing used for price/context (yfinance symbol)
# - aliases: case-insensitive substring/word-boundary match against the
#   recipient/awardee/winner field. Include legal-entity forms, common abbreviations,
#   subsidiaries that commonly appear in procurement records.
