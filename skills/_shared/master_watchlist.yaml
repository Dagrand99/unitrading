# ── Thresholds ─────────────────────────────────────────────────
alert_thresholds:
  # Email triggered when |LLM predicted_pct| > this value (percent points).
  # 3.0 per user spec.
  predicted_pct_alert: 3.0

  # Skip very small contracts that the LLM will almost always rate sub-1% impact.
  # Each source can override (some sources have natural reporting floors).
  min_contract_value_usd: 1000000

  # When an existing contract record is updated, re-alert only if the award amount
  # changes by more than this fraction (so option exercises that add $100M to a
  # known IDIQ still fire, but a 2% rounding adjustment doesn't).
  update_material_value_delta: 0.25

# Approximate FX → USD (used by TED & gov.uk routines that report local currency).
# Annual refresh is fine; precision <1% is below alert noise floor.
fx_to_usd:
  EUR: 1.08
  GBP: 1.27
  SEK: 0.095
  NOK: 0.092
  DKK: 0.145
  PLN: 0.25
  CZK: 0.044
  CHF: 1.12
  CNY: 0.14
  USD: 1.0
