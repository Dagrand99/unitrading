# LinkedIn hiring watchlist for linkedin-hiring-monitor.
#
# Each entry is queried via SerpAPI (Google search scoped to
# linkedin.com/jobs/view URLs, past-week filter). A company crosses
# the "massive hiring" threshold when the dedup'd job count in the
# 7-day window meets or exceeds ALERT_THRESHOLD_JOBS in scripts/run.py.
#
# Fields:
#   - ticker: yfinance symbol (used only for the email header / sorting)
#   - name:   human-readable label
#   - sector: IT | Auto | Energy
#   - country: ISO-2
#   - search_terms: list of exact-quoted queries tried in order.
#     The first one that returns ≥1 hit wins; remaining terms are
#     skipped to save SerpAPI quota. Put the most distinctive name
#     first (avoid generic words that match unrelated companies).

companies:
  # ── IT / Semiconductors / Cloud ───────────────────────────────
