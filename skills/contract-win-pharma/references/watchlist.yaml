alert_thresholds:
  unreacted_ratio: 0.5
  # $5M floor: catches Valneva DLA orders (~$10-16M) and small NIH/EPA awards
  # to Evotec; below this is mostly VA pharmacy noise. Bavarian Nordic /
  # Moderna BARDA awards land at $100M+ so the threshold doesn't constrain them.
  min_contract_value_usd: 5000000
  min_abs_predicted_pct: 1.0
